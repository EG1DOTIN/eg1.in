<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(185, 16, 34)" />
      <stop offset="100%" stop-color="rgb(2, 132, 199)" />
    </linearGradient>
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge Squircle matching 38px/10px border-radius ratio -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#badgeGrad)"/>
  <!-- Crisp Centered White Lightning Bolt with subtle depth shadow -->
  <path d="M 71 20 L 39 67 L 64 67 L 55 108 L 91 59 L 66 59 Z" 
        fill="#ffffff" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linejoin="round" 
        stroke-linecap="round"
        filter="url(#boltShadow)"/>
</svg>
