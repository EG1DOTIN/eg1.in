<body>
    <center>
        <div>
            <!-- Header will be loaded by include-components.js -->
            <div id="header-placeholder"></div>

            <!-- Main Content -->
            <div class="box-100 bg-E3 main-master">
                <div id="Content3Header" class="col-md-12" style="display:none;">
                    <span id="contactTitleText">
                        <h1>CONTACT EG1</h1>
                        <p style="font-size: 20px; text-align: center;">
                            To maintain a high-quality community, please avoid posting spam or irrelevant content.<br />
                            Your feedback and suggestions are welcome.
                        </p>
                    </span>
                </div>
            </div>

            <!-- Contact Page Content from Firestore (currently not required)-->
            <!-- <div id="contactContentText" class="box-90 content" style="text-align:left;"></div> -->

            <!-- Contact Form -->
            <div id="contact" class="box-90 content">
                <div class="row">
                    <div class="col-md-6">
                        <div class="col-md-12 box-bg left">
                            <h3 class="text-none font-light h3border" style="color:black">Any message?</h3>
                            <br />
                            <form id="contactForm">
                                <div class="row">
                                    <div class="col-sm-12 margin-bottom">
                                        <div class="input-group">
                                            <span class="input-group-addon"><i class="icon icon-user i"></i></span>
                                            <input type="text" id="txtname" name="name" title="Name" required="required"
                                                class="form-control flat" placeholder="Name">
                                        </div>
                                    </div>
                                    <div class="col-sm-12 margin-bottom">
                                        <div class="input-group">
                                            <span class="input-group-addon"><i class="icon icon-envelope"></i></span>
                                            <input type="email" id="txtemail" name="email" title="Email-id"
                                                required="required" class="form-control flat"
                                                placeholder="Email address">
                                        </div>
                                    </div>
                                    <div class="col-sm-12 margin-bottom">
                                        <div class="input-group">
                                            <span class="input-group-addon"><i class="icon icon-phone"></i></span>
                                            <input type="tel" id="txtcontact" name="contact" title="Contact No."
                                                required="required" maxlength="10" class="form-control flat"
                                                placeholder="Contact Number" pattern="[0-9]*">
                                        </div>
                                    </div>
                                    <!-- Anti-Spam Math Captcha (hidden until user interacts) -->
                                    <div class="row" style="display:none;" id="botCheckContainer">
                                        <div class="col-sm-12 margin-bottom">
                                            <label>Anti-Spam Check: What is <span id="num1"></span> <span
                                                    id="mathOp">+</span> <span id="num2"></span>?</label>
                                            <input type="number" id="txtbot" class="form-control flat"
                                                placeholder="Answer" />
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12 margin-bottom">
                                        <div class="input-group">
                                            <span class="input-group-addon"><i class="icon icon-pencil"></i></span>
                                            <textarea id="txtenq" name="message" class="form-control flat"
                                                style="height: 110px; resize: none; overflow-y: auto;"
                                                placeholder="Your message..."></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12 mrgin-top10">
                                        <button type="submit" id="btnsend" class="btn btn-primary"> Send ⮠ </button>
                                    </div>
                                </div>
                            </form>
                            <div id="contactMessage" style="margin-top: 10px;"></div>
                        </div>
                    </div>
                    <!-- <div class="col-md-3">
                    <div class="col-md-12 box-bg left">
                        <h2 style="font-size:19px; font-weight:bold;">CONNECT ON OTHER PLATFORMS</h2>
                    </div>
                    <div class="col-md-12 box-bg left">
                        <p>
                            <strong>Facebook:</strong> <a href="https://www.facebook.com/eg1dotin" target="_blank">eg1dotin</a><br />

                            <strong>YouTube:</strong> <a href="https://www.youtube.com/channel/eg1dotin" target="_blank">eg1dotin</a><br />
                        </p>
                    </div>
                </div> -->
                </div>
            </div>

            <!-- Footer will be loaded by include-components.js -->
            <div id="footer-placeholder"></div>
        </div>

    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
