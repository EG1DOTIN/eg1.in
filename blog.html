<!doctype html>
<!--
    EG1 Blog page entry point.
    This page supports three modes:
    1. blog.html?id=<id> or blog.html?title=<title> -> detailed article view
    2. blog.html -> latest article preview with sidebar
    3. blog.html?cat=<category> / ?search=<query> -> paginated blog grid

    The page logic is intentionally kept in js/blog-page.js so the HTML stays
    focused on structure and the JavaScript can be documented and reused safely.
-->
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>EG1 BLOG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <meta name="title" content="EG1 BLOG" />
    <meta name="description"
        content="Learn coding, get source code of various tutorials, functions, logics, mathematical problems, graphics, animations and small useful applications." />
    <meta name="keywords" content="blog, programming, tutorials, source code, coding" />

    <!-- Stylesheets -->
    <link href="css/main.css" rel="stylesheet" type="text/css" />
    <link href="css/responsive.css" rel="stylesheet" type="text/css" />
    <link href="css/font-awesome.css" rel="stylesheet" type="text/css" />
    <link href="css/fonts.css" rel="stylesheet" type="text/css" />
    <link href="css/common.css" rel="stylesheet" type="text/css" />
    <link href="css/menuCss.css" rel="stylesheet" type="text/css" />
    <link href="css/scrollbar.css" rel="stylesheet" type="text/css" />
    <link href="css/socialbuttons.css" rel="stylesheet" type="text/css" />
    <link href="js/slick.css" rel="stylesheet" type="text/css" />
    <link href="js/slick-theme.css" rel="stylesheet" type="text/css" />
    <link href="css/blog-detail.css" rel="stylesheet" type="text/css" />
    <link href="css/blog-grid.css" rel="stylesheet" type="text/css" />
    <link href="img/eg1logo.webp" rel="Shortcut Icon" type="image/webp" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">

    <!-- Scripts -->
    <script src="js/mootools.js" type="text/javascript"></script>
    <script src="js/jquery-2.1.1.min.js" type="text/javascript"></script>
    <script src="js/include-components.js" type="text/javascript"></script>

</head>

<body>
    <center>
        <div>
            <!-- Header will be loaded by include-components.js -->
            <div id="header-placeholder"></div>

            <!-- Main Content -->
            <div class="box-100 bg-E3 main-master">
                <div id="Content3Header" class="col-md-12">
                    <h1 id="blogTitle"><span id="blogPageTitleText">Blog</span></h1>
                </div>
                <!-- <div class="row body"></div> -->
            </div>

            <!-- Blog Page Content from Firestore (currently not required it) -->
            <!-- <div id="blogPageContentText" class="box-90 content" style="text-align:left;"></div> -->

            <!-- Content shell for either the detail view or the paginated grid. -->
            <div class="box-90 content">

                <div class="row">
                    <div class="col-md-9" id="blogContainer">
                        <!-- Blog list or blog detail will be loaded here -->
                        <div class="loading-message">
                            <span class="loader"></span> Loading blog...
                        </div>
                    </div>
                    <div class="col-md-4" id="sidebarColumn">
                        <div class="sidebar" id="sidebarContainer">
                            <div class="row">
                                <div class="col-md-12 margin-bottom">
                                    <div class="input-group input-group-lg"
                                        style="border-radius: 6px; border: 1px solid #3b3b3b;">
                                        <input type="text" id="txtSearch" class="form-control"
                                            placeholder="search blog here" />
                                        <span class="input-group-btn">
                                            <button class="btn btn-default bg-f2" onclick="searchBlogs()">
                                                Search
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="box box-solid box-black"
                                        style="border-radius: 6px; border: 1px solid #3b3b3b;">
                                        <div class="box-header" style="border-radius: 6px; border: 1px solid #3b3b3b;">
                                            Category</div>
                                        <div class="box-body">
                                            <ul class="mrgin-top10 abc row" id="category-list">
                                                <!-- Categories will be loaded here -->
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="previousTopics" class="sidebar-section">
                                <!-- Previous topics will be loaded here -->
                            </div>
                            <div id="relatedBlogsGrid" class="sidebar-section mrgin-top20">
                                <!-- Related topics will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer will be loaded by include-components.js -->
            <div id="footer-placeholder"></div>
        </div>
    </center>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-analytics-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/visitor-tracker.js" async></script>
    <script src="js/slick.min.js" type="text/javascript"></script>
    <script src="js/app.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/blog-page.js" type="text/javascript"></script>
    <script src="js/blog-content.js" type="text/javascript"></script>
</body>

</html>
