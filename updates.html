<html lang="en">

    <!-- Stylesheets -->
    <link href="css/main.css" rel="stylesheet" type="text/css" />
    <link href="css/responsive.css" rel="stylesheet" type="text/css" />

<body>
    <center>
        <div>
            <!-- Header will be loaded by include-components.js -->
            <div id="header-placeholder"></div>

            <!-- Header Banner Section -->
            <div class="box-100 bg-E3 main-master">
                <div id="Content3Header" class="col-md-12" style="display:none;">
                    <h1><span id="updatesTitleText">UPDATES &amp; RELEASES</span></h1>
                    <div>
                        <br />
                    </div>
                </div>
            </div>

            <!-- Updates Main Content Area -->
            <div class="box-90 content">
                <div class="updates-page-container">
                    
                    <!-- Filter and Meta Header -->
                    <div class="updates-page-header">
                        <div>
                            <h2 class="updates-page-title">Changelog &amp; Release Notes</h2>
                            <p class="updates-page-subtitle">Track platform enhancements, security fixes, and new application releases.</p>
                        </div>
                        <div class="updates-filter-group" id="updatesFilterGroup" role="tablist">
                            <button type="button" class="updates-filter-btn active" data-filter="all">All Updates</button>
                            <button type="button" class="updates-filter-btn" data-filter="website">Website</button>
                            <button type="button" class="updates-filter-btn" data-filter="app">Apps</button>
                        </div>
                    </div>

                    <!-- Updates Timeline List -->
                    <div id="updatesPageListContainer" class="updates-timeline-list">
                        <div class="updates-loading-box">
                            <div class="updates-spinner"></div>
                            <p>Loading latest updates...</p>
                        </div>
                    </div>
